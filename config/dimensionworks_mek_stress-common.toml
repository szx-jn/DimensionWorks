[energy]
	#Mekanism FE represented by one SU. Default: 2.5 FE = 1 SU.
	#Range: 0.001 ~ 1000000.0
	mekanismPerSu = 2.5

[memory_card_capacity]
	#Base SU stored by one DDR1 balanced Memory Card.
	ddr1CardSu = 8192
	#Base SU stored by one DDR2 balanced Memory Card.
	ddr2CardSu = 9216
	#Base SU stored by one DDR3 balanced Memory Card.
	ddr3CardSu = 10240
	#Base SU stored by one DDR4 balanced Memory Card.
	ddr4CardSu = 12288
	#Base SU stored by one DDR5 balanced Memory Card.
	ddr5CardSu = 16384

[memory_drive_bandwidth]
	#RPM bandwidth provided by one DDR1 Memory Drive.
	ddr1BandwidthRpm = 8192
	#RPM bandwidth provided by one DDR2 Memory Drive.
	ddr2BandwidthRpm = 16384
	#RPM bandwidth provided by one DDR3 Memory Drive.
	ddr3BandwidthRpm = 32768
	#RPM bandwidth provided by one DDR4 Memory Drive.
	ddr4BandwidthRpm = 65536
	#RPM bandwidth provided by one DDR5 Memory Drive.
	ddr5BandwidthRpm = 131072

[memory_card_types]
	#Independent chance for each crafted normal card to become a defective card.
	#Range: 0.0 ~ 1.0
	defectiveChance = 0.25
	[memory_card_types.economy]
		storageExponent = -1
		speedExponent = -1
	[memory_card_types.balanced]
		storageExponent = 0
		speedExponent = 0
	[memory_card_types.high_speed]
		storageExponent = -1
		speedExponent = 1
	[memory_card_types.high_storage]
		storageExponent = 1
		speedExponent = -1
	[memory_card_types.defective]
		storageExponent = -2
		speedExponent = -2
	[memory_card_types.final]
		storageExponent = 2
		speedExponent = 2

[mekanism_machine_rpm]
	#Basic Mekanism machine target RPM.
	basicRpm = 512
	#Advanced Mekanism machine target RPM.
	advancedRpm = 1024
	#Elite Mekanism machine target RPM.
	eliteRpm = 2048
	#Ultimate Mekanism machine target RPM.
	ultimateRpm = 4096

[tuning]
	#Exponent for network efficiency and AE production scaling.
	efficiencyExponent = 1.25
	#Maximum effective RPM available to a Create-direct machine.
	directMaxRpm = 10240
