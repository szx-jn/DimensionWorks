
[auth]
	#Range: 1000 ~ 600000
	timeoutMs = 30000
	#1.3.0 的超时始终拒绝；此项仅为兼容旧配置而保留。
	allowOfflineOnTimeout = false
	#关闭客户端明确报告没有登录会话时的离线登录；校验失败本身在 1.3.0 中始终拒绝。
	allowOfflineOnFailure = false
	timeoutKickMessage = "trueuuid.disconnect.timeout"
	offlineFallbackMessage = "trueuuid.chat.offline_fallback"
	offlineShortSubtitle = "trueuuid.subtitle.offline"
	onlineShortSubtitle = "trueuuid.subtitle.online"
	#一旦该名字成功验证过正版，后续鉴权失败时禁止以离线身份进入。
	knownPremiumDenyOffline = true
	#不允许未知名字以离线身份进入；与 allowOfflineOnFailure=false 一起保持双重认证策略。
	allowOfflineForUnknownOnly = false
	#启用调试日志输出
	debug = false
	[auth.yggdrasil]
		#1.3.0 使用真正的嵌套配置路径，并按精确主机名匹配；仅信任 MSL 皮肤站。
		apiRootWhitelist = ["skin.mslmc.net"]

	[auth.recentIpGrace]
		#1.3.0 已移除同 IP 重连宽限；保留关闭值供旧配置兼容，重连必须重新验证。
		enabled = false
		#旧版兼容值；1.3.0 不再使用此窗口。
		#Range: 1 ~ 60
		ttlSeconds = 10

