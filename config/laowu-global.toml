disabled_traits = [-1]
#全局覆盖：-1=使用各存档独立设置；0=强制关闭；1=强制开启。
#覆盖时游戏内对应选项锁定，但不会改写存档原值；改回-1即可恢复。
#联机时只以服务器的此文件为准，客户端本地文件不能覆盖服务器规则。
#Global overrides: -1 = per-world setting; 0 = force off; 1 = force on.
#Only the server/host config is authoritative. Existing world values are preserved.
#是否在JEI展示地狱配方；仅影响展示。
show_hell_recipes = -1
#野生猫是否使用原版避人/受伤逃跑AI。-1=存档，0=关，1=开。
wild_cats_flee = -1
#猫咪是否哈气；航空箱产气不受此开关影响。-1=存档，0=关，1=开。
cats_hiss = -1
#死亡变猫饼时是否随机扣除一项基础属性。-1=存档，0=关，1=开；存档默认开启。
cat_death_attribute_penalty_enabled = -1
#死亡时随机一项基础属性的扣除点数；-1=存档（默认20），0=不扣除。
#非负整数强制覆盖并锁定；最低扣到0，不改变属性上限。死亡扣属性开关关闭时不生效。
cat_death_attribute_loss = -1

#属性倍率：每项-1=使用存档设置（存档默认1）；0~999999=全局强制倍率。
#仅缩放实际能力公式的属性输入，不改写猫咪基础属性、培养上限或套装固定加成。
#Each multiplier: -1 = per-world (default 1); 0..999999 = forced global value.
#Values between -1 and 0, NaN and infinity are invalid.
[attribute_multipliers]
	attack = -1.0
	health = -1.0
	speed = -1.0
	stamina = -1.0
	intelligence = -1.0
	luck = -1.0

#职业套装公式系数K：-1=使用存档；0~999999=强制覆盖并锁定。
#直接替换公式内的原系数，不是整体伤害倍率；存档默认使用各套装原值。物流猫仍不主动攻击。
#Career formula coefficient K: -1 = per-world; 0..999999 = forced coefficient, not an extra damage multiplier.
[career_damage_coefficients]
	#机械套装；套装默认系数 K = 0.75
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	terminator = -1.0
	#钓鱼套装；套装默认系数 K = 0.55
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	fishing = -1.0
	#飞行套装；套装默认系数 K = 2.0
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	flight = -1.0
	#喷火套装；套装默认系数 K = 0.75
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	fire = -1.0
	#采蜜套装；套装默认系数 K = 1.2
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	honey = -1.0
	#物流套装；套装默认系数 K = 0.0（辅助职业，不主动攻击）
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	transport = -1.0
	#雷管套装；套装默认系数 K = 1.5
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	dynamite = -1.0
	#工程套装；套装默认系数 K = 3.0
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	engineering = -1.0
