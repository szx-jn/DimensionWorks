	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	medical = -1.0
	#音乐套装；套装默认系数 K = 0.0（辅助职业，不主动攻击）
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	music = -1.0
	#特工套装；套装默认系数 K = 1.75
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	agent = -1.0
	#潜水套装；套装默认系数 K = 1.0
	#-1 = 沿用存档；填写 0~999999 则强制使用该 K，并锁定游戏内对应选项。
	diving = -1.0
