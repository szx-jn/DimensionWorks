name: Sync README to BBSMC

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/sync-bbsmc-readme.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Convert repository-relative links for BBSMC
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import PurePosixPath
          from urllib.parse import quote, urlsplit, urlunsplit
          import re

          source = open("README.md", encoding="utf-8").read()
          base = "https://github.com/szx-jn/DimensionWorks"
          ref = "main"

          # Rewrite inline Markdown links and images, leaving external URLs and
          # in-page anchors untouched. GitHub's README remains unchanged.
          pattern = re.compile(r'(!?\[[^\]]*\]\()([^\s)]+)([^)]*\))')

          def rewrite(match):
              prefix, target, suffix = match.groups()
              parts = urlsplit(target)

              if parts.scheme or parts.netloc or target.startswith("#"):
                  return match.group(0)

              path = parts.path
              if not path:
                  return match.group(0)

              normalized = str(PurePosixPath(path))
              if normalized.startswith("../") or normalized == "..":
                  return match.group(0)

              kind = "tree" if path.endswith("/") else "blob"
              encoded = quote(normalized, safe="/:@-._~!$&'()*+,;=%")
              absolute = f"{base}/{kind}/{ref}/{encoded}"\n              if parts.query:\n                  absolute += "?" + parts.query\n              if parts.fragment:\n                  absolute += "#" + parts.fragment
              return prefix + absolute + suffix

          converted = pattern.sub(rewrite, source)
          open("/tmp/bbsmc-readme.md", "w", encoding="utf-8").write(converted)

          print("Converted repository-relative Markdown links for BBSMC.")
          print(f"README source bytes: {len(source.encode('utf-8'))}")
          print(f"BBSMC body bytes: {len(converted.encode('utf-8'))}")
          PY

      - name: Update and verify BBSMC project description
        env:
          BBSMC_TOKEN: ${{ secrets.BBSMC_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${BBSMC_TOKEN:-}" ]]; then
            echo "::error::Repository secret BBSMC_TOKEN is missing or empty."
            exit 1
          fi

          payload="$(jq -n --rawfile body /tmp/bbsmc-readme.md '{body: $body}')"

          status="$(curl --silent --show-error \
            --output /tmp/bbsmc-patch-response.json \
            --write-out '%{http_code}' \
            --request PATCH \
            --url "https://api.bbsmc.net/v2/project/dimensionworks" \
            --header "Authorization: ${BBSMC_TOKEN}" \
            --header "Content-Type: application/json" \
            --header "User-Agent: szx-jn/DimensionWorks-readme-sync" \
            --data-binary "${payload}")"

          if [[ "${status}" != "204" ]]; then
            echo "::error::BBSMC PATCH returned HTTP ${status}."
            cat /tmp/bbsmc-patch-response.json
            exit 1
          fi

          curl --silent --show-error --fail-with-body \
            --url "https://api.bbsmc.net/v2/project/dimensionworks" \
            --header "Authorization: ${BBSMC_TOKEN}" \
            --header "User-Agent: szx-jn/DimensionWorks-readme-sync" \
            --output /tmp/bbsmc-project.json

          jq -e --rawfile expected /tmp/bbsmc-readme.md '.body == $expected' /tmp/bbsmc-project.json >/dev/null

          echo "BBSMC project body updated and verified successfully."
