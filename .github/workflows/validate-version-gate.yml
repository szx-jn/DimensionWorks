name: Validate DimensionWorks version gate

on:
  pull_request:
  push:
    branches:
      - main
      - feature/version-gate-and-safe-updater

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Validate updater shell syntax
        run: |
          bash -n release-updaters/update-dimensionworks-client.sh
          bash -n release-updaters/update-dimensionworks-server.sh

      - name: Validate Python, JSON and KubeJS
        run: |
          set -euo pipefail
          python3 -m json.tool manifest/mods.json >/dev/null
          node --check kubejs/server_scripts/basic_mineral_propagation.js
          node --check kubejs/server_scripts/cave_self_propagation.js
          node --check kubejs/server_scripts/crushing_api.js
          node --check kubejs/startup_scripts/mineral_processing_items.js
          node scripts/check_cave_self_propagation.js
          python3 -m py_compile scripts/package_mrpack.py scripts/package_server.py scripts/pack_manifest.py
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s release-updaters/tests -v

      - name: Build version gate mod
        working-directory: mods/dimensionworks-version-gate
        run: gradle build --no-daemon
