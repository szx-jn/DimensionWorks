name: 代码与脚本检查

on:
  pull_request:
    paths:
      - 'manifest/**'
      - 'kubejs/**'
      - 'scripts/**'
      - '.github/workflows/validate-version-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'manifest/**'
      - 'kubejs/**'
      - 'scripts/**'
      - '.github/workflows/validate-version-gate.yml'

concurrency:
  group: validate-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: 检查脚本与配置
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装图像测试依赖
        run: python3 -m pip install -r scripts/requirements-memory-assets.txt

      - name: 检查 JSON、KubeJS 与 Python
        run: |
          set -euo pipefail
          python3 -m json.tool manifest/mods.json >/dev/null
          node --check kubejs/server_scripts/basic_mineral_propagation.js
          node --check kubejs/server_scripts/cave_self_propagation.js
          node --check kubejs/server_scripts/crushing_api.js
          node --check kubejs/startup_scripts/mineral_processing_items.js
          node scripts/check_cave_self_propagation.js
          python3 -m py_compile scripts/package_mrpack.py scripts/package_server.py scripts/pack_manifest.py
          python3 -m unittest discover -s scripts/tests -v
