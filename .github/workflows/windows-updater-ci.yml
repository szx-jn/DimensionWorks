name: Windows 更新器构建与测试

on:
  push:
    paths:
      - 'update-Windows/**'
      - '.github/workflows/windows-updater-ci.yml'
  pull_request:
    paths:
      - 'update-Windows/**'
      - '.github/workflows/windows-updater-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译并测试更新器
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: update-Windows/go.mod

      - name: 运行更新器测试
        working-directory: update-Windows
        run: go test -v ./...

      - name: 交叉编译 Windows 客户端与服务端更新器
        working-directory: update-Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          for kind in client server; do
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w -X main.defaultKind=${kind}" \
              -o "../dist/update-dimensionworks-${kind}.exe" \
              .
            file "../dist/update-dimensionworks-${kind}.exe" | grep -q 'PE32+ executable'
          done

      - name: 上传 Windows 更新器
        uses: actions/upload-artifact@v4
        with:
          name: dimensionworks-windows-updaters
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/update-dimensionworks-client.exe
            dist/update-dimensionworks-server.exe

  windows-smoke:
    name: 在 Windows 环境验证更新器
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: update-Windows/go.mod

      - name: 在 Windows 上运行测试
        working-directory: update-Windows
        run: go test -v ./...

      - name: 构建并冒烟测试 Windows 程序
        working-directory: update-Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force ../dist | Out-Null
          foreach ($kind in @("client", "server")) {
            $exe = "../dist/update-dimensionworks-$kind.exe"
            go build -trimpath -ldflags="-s -w -X main.defaultKind=$kind" -o $exe .
            if ($LASTEXITCODE -ne 0) { throw "构建 $kind 更新器失败" }
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw "$kind 更新器冒烟测试失败" }
          }
