name: 自研模组构建

on:
  pull_request:
    paths:
      - 'mods/dimensionworks-*/**'
      - 'gradle/**'
      - 'gradlew*'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'AGENTS.md'
      - 'scripts/**'
      - '.github/workflows/build-java-mods.yml'

concurrency:
  group: build-java-mods-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed-modules:
    name: 查找变更模组
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      has_modules: ${{ steps.changed.outputs.has_modules }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算变更模组
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            printf 'matrix={"module":[]}\n' >> "$GITHUB_OUTPUT"
            printf 'has_modules=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matrix="$(python3 - "$base" "$HEAD_SHA" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", sys.argv[1], sys.argv[2]],
              text=True,
          ).splitlines()
          target_modules = {
              path.parents[4].name
              for path in Path("mods").glob("dimensionworks-*/src/main/resources/META-INF/neoforge.mods.toml")
          }
          modules = sorted({
              parts[1]
              for path in changed
              if len(parts := path.split("/")) > 1
              and parts[0] == "mods"
              and parts[1] in target_modules
          })
          shared = {"build.gradle", "settings.gradle", "gradle.properties", "gradlew", "gradlew.bat"}
          if any(path in shared or path.startswith("gradle/") for path in changed):
              modules = sorted(set(modules) | target_modules)
          print(json.dumps({"module": modules}, separators=(",", ":")))
          PY
          )"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"module":[]}' ]]; then
            printf 'has_modules=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_modules=true\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 构建 ${{ matrix.module }}
    needs: changed-modules
    if: needs.changed-modules.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        module: ${{ fromJson(needs.changed-modules.outputs.matrix).module }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 构建并测试模组
        run: ./gradlew :${{ matrix.module }}:build --no-daemon --console=plain

      - name: 运行已接入的服务器 GameTest
        env:
          MODULE: ${{ matrix.module }}
        run: |
          if [[ -d "mods/$MODULE/src/gameTest" ]]; then
            ./gradlew ":$MODULE:runGameTestServer" --no-daemon --console=plain
          fi

  architecture:
    name: 架构依赖边界检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 检查模组依赖环与分层边界
        run: python3 scripts/check_architecture.py

      - name: 测试架构依赖图解析
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_architecture.py' -v
