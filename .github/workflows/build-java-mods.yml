name: 自研模组构建

on:
  pull_request:
    paths:
      - 'mods/dimensionworks-*/**'
      - '.github/workflows/build-java-mods.yml'
  push:
    branches: [main]
    paths:
      - 'mods/dimensionworks-*/**'
      - '.github/workflows/build-java-mods.yml'

concurrency:
  group: build-java-mods-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed-modules:
    name: 查找变更模组
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
      has_modules: ${{ steps.changed.outputs.has_modules }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 计算变更模组
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            printf 'matrix={"module":[]}\n' >> "$GITHUB_OUTPUT"
            printf 'has_modules=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matrix="$(python3 - "$base" "$HEAD_SHA" <<'PY'
          import json
          import subprocess
          import sys

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", sys.argv[1], sys.argv[2]],
              text=True,
          ).splitlines()
          modules = sorted({
              parts[1]
              for path in changed
              if len(parts := path.split("/")) > 1
              and parts[0] == "mods"
              and parts[1].startswith("dimensionworks-")
          })
          print(json.dumps({"module": modules}, separators=(",", ":")))
          PY
          )"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == '{"module":[]}' ]]; then
            printf 'has_modules=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_modules=true\n' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 构建 ${{ matrix.module }}
    needs: changed-modules
    if: needs.changed-modules.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        module: ${{ fromJson(needs.changed-modules.outputs.matrix).module }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mods/${{ matrix.module }}/**/*.gradle*

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: 构建并测试模组
        working-directory: mods/${{ matrix.module }}
        run: gradle build --no-daemon

      - name: 动力网络保存恢复回归
        if: matrix.module == 'dimensionworks-rpm-limit'
        working-directory: mods/dimensionworks-rpm-limit
        run: gradle runGameTestServer --no-daemon
