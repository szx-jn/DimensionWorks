name: Build DimensionWorks RPM Limit
on:
  push:
    paths:
      - 'mods/dimensionworks-rpm-limit/**'
      - '.github/workflows/build-rpm-limit.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods/dimensionworks-rpm-limit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dimensionworks-rpm-limit
          path: mods/dimensionworks-rpm-limit/build/libs/*.jar
