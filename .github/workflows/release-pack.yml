name: 整合包正式发布

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "指定发布版本，例如 0.2.0；留空则自动计算"
        required: false
        type: string
      dimension_complete:
        description: "仅在完成一个维度时允许提升次版本号"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "跳过测试，仅执行构建和静态产物校验；发行说明记录此状态"
        required: false
        default: false
        type: boolean
      release_features:
        description: "新增功能；每行一条，如 feat(create): 新增独立客户端遮挡剔除模组"
        required: false
        type: string
      release_fixes:
        description: "问题修复；每行一条，如 fix(updater): 修复下载预检超时与引擎退出异常"
        required: false
        type: string
      release_performance:
        description: "性能优化；每行一条，如 perf(create): 跳过完整遮挡的传动部件绘制"
        required: false
        type: string
      release_other:
        description: "其他变更；每行一条，如 docs: 更新使用说明"
        required: false
        type: string
permissions:
  contents: write

jobs:
  release:
    name: 打包客户端与服务端
    concurrency:
      group: dimensionworks-release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备固定版本 Create 编译依赖
        run: python3 scripts/prepare_create_build_repository.py

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: 确定发布版本
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          DIMENSION_COMPLETE: ${{ inputs.dimension_complete }}
        run: |
          set -euo pipefail
          latest_tag="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          version="$(python3 - "$latest_tag" <<'PY'
          import sys
          import os
          from pathlib import Path
          import sys as _sys
          _sys.path.insert(0, "scripts")
          import pack_version
          latest = sys.argv[1].strip() or None
          current = pack_version.read_current_version()
          baseline = current
          if latest:
              baseline = max(baseline, pack_version.PackVersion.parse(latest[1:]))
          Path("VERSION").write_text(f"{baseline}\n", encoding="utf-8")
          requested = os.environ.get("REQUESTED_VERSION", "").strip() or None
          dimension_complete = os.environ.get("DIMENSION_COMPLETE", "").lower() == "true"
          target = pack_version.resolve_version(
              requested,
              dimension_complete=dimension_complete,
              current=baseline,
          )
          print(target)
          PY
          )"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 准备打包与校验环境
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          instance_dir="$RUNNER_TEMP/dimensionworks-instance"
          cache_dir="$RUNNER_TEMP/dimensionworks-pack-cache"
          python3 scripts/prepare_ci_instance.py \
            --instance-dir "$instance_dir" \
            --cache-dir "$cache_dir"
          echo "CI_INSTANCE_DIR=$instance_dir" >> "$GITHUB_ENV"
          echo "PACK_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"

      - name: 构建并打包服务端
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          PACK_VERSION: ${{ steps.version.outputs.version }}
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
          DIMENSION_COMPLETE: ${{ inputs.dimension_complete }}
          DIMENSIONWORKS_SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          set -euo pipefail
          mkdir -p dist
          dimension_args=()
          if [[ "$DIMENSION_COMPLETE" == "true" ]]; then
            dimension_args+=(--dimension-complete)
          fi
          python3 scripts/package_server.py \
            --version "$PACK_VERSION" \
            --base-release "${LATEST_TAG:-none}" \
            --instance-dir "$CI_INSTANCE_DIR" \
            --cache-dir "$PACK_CACHE_DIR" \
            --output "dist/DimensionWorks-Server-${PACK_VERSION}.zip" \
            --manifest-output "dist/DimensionWorks-Server-${PACK_VERSION}-update-manifest.tsv" \
            "${dimension_args[@]}"

      - name: 生成服务端增量更新包
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_VERSION: ${{ steps.version.outputs.version }}
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
        run: |
          set -euo pipefail
          delta="dist/DimensionWorks-Server-${PACK_VERSION}-delta.zip"
          if [[ -n "$LATEST_TAG" ]]; then
            previous_version="${LATEST_TAG#v}"
            previous="$RUNNER_TEMP/DimensionWorks-Server-${previous_version}.zip"
            gh release download "$LATEST_TAG" \
              --pattern "DimensionWorks-Server-${previous_version}.zip" \
              --dir "$(dirname "$previous")" \
              --clobber
            python3 scripts/build_server_delta.py \
              --base "$previous" \
              --new "dist/DimensionWorks-Server-${PACK_VERSION}.zip" \
              --output "$delta"
          else
            python3 scripts/build_server_delta.py \
              --new "dist/DimensionWorks-Server-${PACK_VERSION}.zip" \
              --output "$delta" \
              --empty
          fi

      - name: 打包客户端
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          PACK_VERSION: ${{ steps.version.outputs.version }}
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
          DIMENSION_COMPLETE: ${{ inputs.dimension_complete }}
        run: |
          set -euo pipefail
          dimension_args=()
          if [[ "$DIMENSION_COMPLETE" == "true" ]]; then
            dimension_args+=(--dimension-complete)
          fi
          python3 scripts/package_mrpack.py \
            --version "$PACK_VERSION" \
            --base-release "${LATEST_TAG:-none}" \
            --instance-dir "$CI_INSTANCE_DIR" \
            --cache-dir "$PACK_CACHE_DIR" \
            --output "dist/DimensionWorks-${PACK_VERSION}.mrpack" \
            --manifest-output "dist/DimensionWorks-${PACK_VERSION}-update-manifest.tsv" \
            "${dimension_args[@]}" \
            --skip-build

      - name: 生成客户端增量更新包
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_VERSION: ${{ steps.version.outputs.version }}
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
        run: |
          set -euo pipefail
          delta="dist/DimensionWorks-${PACK_VERSION}-delta.zip"
          if [[ -n "$LATEST_TAG" ]]; then
            previous_version="${LATEST_TAG#v}"
            previous="$RUNNER_TEMP/DimensionWorks-${previous_version}.mrpack"
            gh release download "$LATEST_TAG" \
              --pattern "DimensionWorks-${previous_version}.mrpack" \
              --dir "$(dirname "$previous")" \
              --clobber
            python3 scripts/build_server_delta.py \
              --kind client \
              --base "$previous" \
              --new "dist/DimensionWorks-${PACK_VERSION}.mrpack" \
              --output "$delta"
          else
            python3 scripts/build_server_delta.py \
              --kind client \
              --new "dist/DimensionWorks-${PACK_VERSION}.mrpack" \
              --output "$delta" \
              --empty
          fi

      - name: 收集独立遮挡优化模组
        run: |
          set -euo pipefail
          jar="mods/dimensionworks-create-culling/build/libs/dimensionworks_create_culling-0.1.0.jar"
          test -s "$jar"
          unzip -t "$jar" >/dev/null
          if unzip -Z1 "$jar" | grep -q 'ClientRenderProbe'; then
            echo "Test probe must not be included in the release mod" >&2
            exit 1
          fi
          cp "$jar" dist/

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: update-Windows/go.mod

      - name: 测试 Windows 更新器
        if: ${{ !inputs.skip_tests }}
        working-directory: update-Windows
        run: go test -v ./...

      - name: 获取内嵌 aria2 引擎与 GPL 源码包
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          download_github_release() {
            local repository="$1"
            local tag="$2"
            local asset="$3"
            local output="$4"
            local browser_url="https://github.com/${repository}/releases/download/${tag}/${asset}"
            if curl -fL --retry 3 "$browser_url" -o "$output"; then
              return
            fi
            local asset_api
            asset_api="$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${repository}/releases/tags/${tag}" |
              jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .url')"
            curl -fL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/octet-stream' \
              "$asset_api" -o "$output"
          }
          motrix_commit=7012040fec926e16fe8f6c403cf038527f5c18b9
          mkdir -p dist/aria2-source
          download_github_release aria2/aria2 release-1.36.0 aria2-1.36.0.tar.xz \
            dist/aria2-source/aria2-1.36.0.tar.xz
          echo "58d1e7608c12404f0229a3d9a4953d0d00c18040504498b483305bcb3de907a5  dist/aria2-source/aria2-1.36.0.tar.xz" | sha256sum -c -
          curl -fL --retry 3 https://codeload.github.com/agalwood/aria2/tar.gz/905073c6990ee9621a27cf8341ca54de7816bdc5 -o dist/aria2-source/agalwood-aria2-source.tar.gz
          echo "a26bbde0b40f8941e0799365eb56194ff086abd73cbcbca0c7a05863cfe1a467  dist/aria2-source/agalwood-aria2-source.tar.gz" | sha256sum -c -
          curl -fL --retry 3 "https://codeload.github.com/agalwood/Motrix/tar.gz/${motrix_commit}" -o dist/aria2-source/motrix-source.tar.gz
          echo "d15ae99dcca0bbe6c17970e21a49414debbb0a10d6980b101de0cb5d4b23d04e  dist/aria2-source/motrix-source.tar.gz" | sha256sum -c -
          curl -fL --retry 3 https://codeload.github.com/motrixapp/Aria2-Pro-Core/tar.gz/4074895d73324485e3d489bfdb749e9ac7bfadff -o dist/aria2-source/aria2-pro-core-build-source.tar.gz
          echo "ac494b4a6360d3bb6b21605c4f0c6902ba34b6af6c2d986afb1b2fa8d16ed43d  dist/aria2-source/aria2-pro-core-build-source.tar.gz" | sha256sum -c -
          cp update-Windows/third_party/aria2/COPYING dist/aria2-source/COPYING-ARIA2
          cp update-Windows/third_party/aria2/LICENSE-MOTRIX dist/aria2-source/LICENSE-MOTRIX
          cp update-Windows/third_party/aria2/NOTICE.md dist/aria2-source/NOTICE.md
          (cd dist && tar -czf aria2-third-party-source.tar.gz aria2-source)
          rm -rf dist/aria2-source
          python3 scripts/prepare_aria2.py

      - name: 测试 Linux 内置 aria2 实际下载
        if: ${{ !inputs.skip_tests }}
        working-directory: update-Windows
        run: go test -tags bundled_aria2 ./...


      - name: 构建 Windows、Linux、macOS Go 更新器
        working-directory: update-Windows
        shell: bash
        run: |
          set -euo pipefail
          while read -r goos goarch; do
            case "$goos" in
              windows) platform="windows"; extension=".exe" ;;
              linux) platform="linux"; extension="" ;;
              darwin) platform="macos"; extension="" ;;
              *) echo "Unsupported target: $goos" >&2; exit 1 ;;
            esac
            for kind in client server; do
              output="../dist/update-dimensionworks-${kind}-${platform}-${goarch}${extension}"
              echo "Building ${output}"
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -tags bundled_aria2 \
                -trimpath \
                -ldflags="-s -w -X main.defaultKind=${kind}" \
                -o "$output" .
              test -s "$output"
              case "$goos" in
                windows) file "$output" | grep -q 'PE32+ executable' ;;
                linux) file "$output" | grep -q 'ELF 64-bit' ;;
                darwin) file "$output" | grep -q 'Mach-O 64-bit' ;;
              esac
            done
          done <<'TARGETS'
          windows amd64
          linux amd64
          darwin arm64
          TARGETS

      - name: 验证 Linux 单文件更新事务
        if: ${{ !inputs.skip_tests }}
        run: python3 scripts/integration/updater_linux_e2e.py dist/update-dimensionworks-server-linux-amd64

      - name: 检查发布文件
        env:
          PACK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          unzip -t "dist/DimensionWorks-${PACK_VERSION}.mrpack"
          unzip -t "dist/DimensionWorks-Server-${PACK_VERSION}.zip"
          client_version="$(unzip -p "dist/DimensionWorks-${PACK_VERSION}.mrpack" overrides/VERSION | tr -d '\r\n')"
          server_version="$(unzip -p "dist/DimensionWorks-Server-${PACK_VERSION}.zip" VERSION | tr -d '\r\n')"
          [[ "$client_version" == "$PACK_VERSION" ]] || { echo "Client VERSION mismatch: $client_version != $PACK_VERSION" >&2; exit 1; }
          [[ "$server_version" == "$PACK_VERSION" ]] || { echo "Server VERSION mismatch: $server_version != $PACK_VERSION" >&2; exit 1; }
          echo "Client and server VERSION verified: $PACK_VERSION"
          [[ "$(find dist -maxdepth 1 -type f -name 'update-dimensionworks-*' | wc -l)" -eq 6 ]] || { echo "Expected exactly six updater binaries" >&2; exit 1; }
          if compgen -G 'dist/aria2c-*' >/dev/null; then
            echo "Loose aria2 engines must not be published" >&2
            exit 1
          fi
          for target in windows-amd64.exe linux-amd64 macos-arm64; do
            case "$target" in
              windows-amd64.exe) expected='PE32+ executable' ;;
              linux-*) expected='ELF 64-bit' ;;
              macos-*) expected='Mach-O 64-bit' ;;
            esac
            for kind in client server; do
              binary="dist/update-dimensionworks-${kind}-${target}"
              [[ -s "$binary" ]] || { echo "Missing updater: $binary" >&2; exit 1; }
              file "$binary" | grep -q "$expected" || { echo "Wrong binary format: $binary" >&2; exit 1; }
            done
          done
          for engine in aria2-third-party-source.tar.gz; do
            [[ -s "dist/$engine" ]] || { echo "Missing aria2 runtime/source asset: $engine" >&2; exit 1; }
          done
          file update-Windows/aria2-runtime/aria2c-windows-amd64.exe | grep -q 'PE32+ executable'
          file update-Windows/aria2-runtime/aria2c-linux-amd64 | grep -q 'ELF 64-bit'
          file update-Windows/aria2-runtime/aria2c-macos-arm64 | grep -q 'Mach-O 64-bit'
          tar -tzf dist/aria2-third-party-source.tar.gz >/dev/null
          if [[ "$(wc -c < "dist/DimensionWorks-${PACK_VERSION}-delta.zip")" -gt 22 ]]; then
            unzip -t "dist/DimensionWorks-${PACK_VERSION}-delta.zip"
          fi
          if [[ "$(wc -c < "dist/DimensionWorks-Server-${PACK_VERSION}-delta.zip")" -gt 22 ]]; then
            unzip -t "dist/DimensionWorks-Server-${PACK_VERSION}-delta.zip"
          fi
          unzip -p "dist/DimensionWorks-${PACK_VERSION}.mrpack" modrinth.index.json | jq -e . >/dev/null
          cmp "dist/DimensionWorks-${PACK_VERSION}-update-manifest.tsv" \
              <(unzip -p "dist/DimensionWorks-${PACK_VERSION}.mrpack" dimensionworks-update-manifest.tsv)
          cmp "dist/DimensionWorks-Server-${PACK_VERSION}-update-manifest.tsv" \
              <(unzip -p "dist/DimensionWorks-Server-${PACK_VERSION}.zip" dimensionworks-update-manifest.tsv)
          if unzip -Z1 "dist/DimensionWorks-${PACK_VERSION}.mrpack" | grep -E '(^|/)update-dimensionworks-.*(\.(sh|bat|exe)|-(linux|macos)-(amd64|arm64)$)'; then
            echo "Updater script embedded in client package" >&2
            exit 1
          fi
          if unzip -Z1 "dist/DimensionWorks-${PACK_VERSION}-delta.zip" 2>/dev/null |
              grep -E '(^|/)update-dimensionworks-.*(\.(sh|bat|exe)|-(linux|macos)-(amd64|arm64)$)'; then
            echo "Updater script embedded in client delta" >&2
            exit 1
          fi
          if unzip -Z1 "dist/DimensionWorks-Server-${PACK_VERSION}.zip" | grep -E '(^|/)update-dimensionworks-.*(\.(sh|bat|exe)|-(linux|macos)-(amd64|arm64)$)'; then
            echo "Updater script embedded in server package" >&2
            exit 1
          fi
          (
            cd dist
            sha256sum \
              "DimensionWorks-${PACK_VERSION}.mrpack" \
              "DimensionWorks-${PACK_VERSION}-delta.zip" \
              "DimensionWorks-Server-${PACK_VERSION}.zip" \
              "DimensionWorks-${PACK_VERSION}-update-manifest.tsv" \
              "DimensionWorks-Server-${PACK_VERSION}-update-manifest.tsv" \
              "DimensionWorks-Server-${PACK_VERSION}-delta.zip" \
              update-dimensionworks-client-windows-amd64.exe \
              update-dimensionworks-server-windows-amd64.exe \
              update-dimensionworks-client-linux-amd64 \
              update-dimensionworks-server-linux-amd64 \
              update-dimensionworks-client-macos-arm64 \
              update-dimensionworks-server-macos-arm64 \
              aria2-third-party-source.tar.gz \
              dimensionworks_create_culling-0.1.0.jar \
              > SHA256SUMS
          )

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: dimensionworks-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: dist/*

      - name: 发布 GitHub 正式版本
        env:
          GH_TOKEN: ${{ github.token }}
          PACK_VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_FEATURES: ${{ inputs.release_features }}
          RELEASE_FIXES: ${{ inputs.release_fixes }}
          RELEASE_PERFORMANCE: ${{ inputs.release_performance }}
          RELEASE_OTHER: ${{ inputs.release_other }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          set -euo pipefail
          title="DimensionWorks ${PACK_VERSION}"
          notes="$(python3 - <<'PY'
          import os
          sections = (
              "RELEASE_FEATURES",
              "RELEASE_FIXES",
              "RELEASE_PERFORMANCE",
              "RELEASE_OTHER",
          )
          entries = []
          for key in sections:
              entries.extend(
                  line.strip()
                  for line in os.environ.get(key, "").splitlines()
                  if line.strip()
              )
          print(f"DimensionWorks v{os.environ['PACK_VERSION']} 版本更新：")
          if entries:
              print("\n".join(entries))
          else:
            print("更新器：Windows/Linux/macOS 六个更新器全部单文件内嵌 aria2c；同版提供 GPL 许可证与源码，下载仅使用 aria2c，并提供错误原因、单连接兼容重试和超一小时切源。")
          if os.environ.get("SKIP_TESTS", "").lower() == "true":
              print("本次按维护者要求跳过测试，仅执行构建及静态产物校验；未进行游戏内登录或迁移验收。")
          PY
          )"
          assets=(
            "dist/DimensionWorks-${PACK_VERSION}.mrpack"
            "dist/DimensionWorks-${PACK_VERSION}-delta.zip"
            "dist/DimensionWorks-Server-${PACK_VERSION}.zip"
            "dist/DimensionWorks-${PACK_VERSION}-update-manifest.tsv"
            "dist/DimensionWorks-Server-${PACK_VERSION}-update-manifest.tsv"
            "dist/DimensionWorks-Server-${PACK_VERSION}-delta.zip"
            "dist/update-dimensionworks-client-windows-amd64.exe"
            "dist/update-dimensionworks-server-windows-amd64.exe"
            "dist/update-dimensionworks-client-linux-amd64"
            "dist/update-dimensionworks-server-linux-amd64"
            "dist/update-dimensionworks-client-macos-arm64"
            "dist/update-dimensionworks-server-macos-arm64"
            "dist/aria2-third-party-source.tar.gz"
            "dist/dimensionworks_create_culling-0.1.0.jar"
            dist/SHA256SUMS
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "$title" \
            --notes "$notes" \
            "${assets[@]}"

      - name: 回写已发布版本号
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout --force -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          released_version="${TAG#v}"
          printf '%s\n' "${released_version}" > VERSION
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): record ${TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
