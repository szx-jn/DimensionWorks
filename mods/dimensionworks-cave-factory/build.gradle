plugins { id 'java-library' }

version = '0.1.7'
base.archivesName = 'dimensionworks_cave_factory'
apply from: rootProject.file('gradle/neoforge-module.gradle')
apply from: rootProject.file('gradle/neoforge-create.gradle')

dependencies {
    implementation project(':dimensionworks-rpm-limit')
    compileOnly 'maven.modrinth:jei:kmb7KviL'
    compileOnly 'maven.modrinth:jade:eYz2YBGT'
    runtimeOnly 'maven.modrinth:guideme:QeYKsstN'
    runtimeOnly 'maven.modrinth:alexs-caves-unofficial-port:pC1MYhqR'
    runtimeOnly 'maven.modrinth:dimensions-of-alexs-caves-unofficial-port:OJpP9UtE'
    runtimeOnly 'maven.modrinth:citadel-1.21.1-port:mIylVpkN'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
test { useJUnitPlatform() }
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
}

ext.gameTestCount = project.hasProperty('crystalCheck') ? 17 : 12
apply from: rootProject.file('gradle/neoforge-gametest.gradle')

// 按需验证实际 KubeJS 熔融材料脚本与客户端图集；这些检查类不会进入模组 JAR。
if (project.hasProperty('crystalCheck')) {
    dependencies {
        runtimeOnly 'maven.modrinth:kubejs:GDXCpKlp'
        runtimeOnly 'maven.modrinth:rhino:SqkDvOLG'
        runtimeOnly 'maven.modrinth:better-advanced-tooltips:uPFbnD32'
    }
    sourceSets {
        crystalCheck {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    neoForge {
        mods { "${base.archivesName.get()}" { sourceSet sourceSets.crystalCheck } }
        runs {
            client {
                sourceSet = sourceSets.crystalCheck
                gameDirectory = project.file('run-crystal-check')
                systemProperty 'dimensionworks.verifyCrystallizedFluids', 'true'
                jvmArguments.addAll('-Xmx2G', '-XX:ActiveProcessorCount=2')
                programArguments.addAll('--width', '1024', '--height', '600')
            }
            gameTestServer { sourceSet = sourceSets.crystalCheck }
        }
    }
    tasks.register('prepareCrystalCheck', Copy) {
        from rootProject.file('kubejs/startup_scripts/molten_metals.js')
        into 'run-gametest/kubejs/startup_scripts'
    }
    tasks.register('prepareCrystalClientCheck', Copy) {
        from rootProject.file('kubejs/startup_scripts/molten_metals.js')
        into 'run-crystal-check/kubejs/startup_scripts'
    }
    tasks.register('prepareFactoryDataCheck', Copy) {
        from rootProject.file('kubejs/data/dimensionworks_cave_factory')
        into 'run-gametest/kubejs/data/dimensionworks_cave_factory'
    }
    tasks.named('runGameTestServer') { dependsOn 'prepareCrystalCheck', 'prepareFactoryDataCheck' }
    tasks.named('runClient') {
        dependsOn 'prepareCrystalClientCheck'
        doLast {
            def log = file('run-crystal-check/logs/latest.log').getText('UTF-8')
            if (!log.contains('SHARED CREATIVE TAB CHECK PASSED:') || !log.contains('CRYSTALLIZED FLUID CHECK PASSED:')) {
                throw new GradleException('Actual crystallized fluid and shared creative tab checks did not complete')
            }
        }
    }
}

if (project.hasProperty('caveServerDir')) {
    if (!project.hasProperty('crystalCheck')) throw new GradleException('caveServerDir requires -PcrystalCheck')
    def checkDirectory = file(project.property('caveServerDir'))
    neoForge.runs {
        caveServerCheck {
            server()
            sourceSet = sourceSets.crystalCheck
            gameDirectory = checkDirectory
            systemProperty 'dimensionworks.verifyCaveServer', 'true'
            systemProperty 'dimensionworks.verifyCaveReload', project.hasProperty('caveReloadOnly').toString()
            jvmArguments.addAll('-Xmx2G', '-XX:ActiveProcessorCount=2')
            programArgument '--nogui'
        }
    }
    def requireIsolatedWorld = {
        def marker = new File(checkDirectory, 'dimensionworks-cave-check.marker')
        if (!marker.isFile() || marker.getText('UTF-8').trim() != 'isolated-cave-check') {
            throw new GradleException('Cave checks require an explicitly marked isolated world directory')
        }
    }
    tasks.register('prepareCaveServerCheck', Copy) {
        doFirst { requireIsolatedWorld() }
        from(rootProject.file('kubejs/startup_scripts/molten_metals.js')) { into 'kubejs/startup_scripts' }
        from(rootProject.file('kubejs/data/dimensionworks_cave_factory')) { into 'kubejs/data/dimensionworks_cave_factory' }
        into checkDirectory
    }
    tasks.named('runCaveServerCheck') {
        dependsOn 'prepareCaveServerCheck'
        doFirst { requireIsolatedWorld() }
        doLast {
            if (!new File(checkDirectory, 'logs/latest.log').getText('UTF-8').contains(project.hasProperty('caveReloadOnly') ? 'CAVE RELOAD CHECK PASSED:' : 'CAVE SERVER CHECK PASSED:')) {
                throw new GradleException('Actual cave server checks did not complete')
            }
        }
    }
}
