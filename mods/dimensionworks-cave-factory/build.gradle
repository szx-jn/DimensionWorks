plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'eclipse'
    id 'idea'
}

version = '0.1.6'
group = 'dev.szx.dimensionworks'
base.archivesName = 'dimensionworks_cave_factory'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
def rpmLimitBuild = file('../dimensionworks-rpm-limit/build.gradle').getText('UTF-8')
def rpmLimitVersionMatch = rpmLimitBuild =~ /(?m)^version = '([^']+)'$/
if (!rpmLimitVersionMatch.find()) {
    throw new GradleException('Could not determine the RPM limit project version')
}
def rpmLimitVersion = rpmLimitVersionMatch.group(1)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods {
                dimensionworks_cave_factory {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
        gameTestServer {
            args '--nogui'
            property 'forge.enabledGameTestNamespaces', 'dimensionworks_cave_factory'
        }
    }
}

repositories {
    maven { name = 'ModMaven'; url = 'https://modmaven.dev' }
    maven { name = 'Curios'; url = 'https://maven.theillusivec4.top/' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven { name = 'Create'; url = 'https://maven.createmod.net' }
    maven { name = 'Tterrag'; url = 'https://maven.tterrag.com/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.16'
    implementation fg.deobf('com.simibubi.create:create-1.20.1:6.0.8-291:slim')
    implementation fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
    compileOnly fg.deobf(files("../dimensionworks-rpm-limit/build/libs/dimensionworks_rpm_limit-${rpmLimitVersion}.jar"))
    compileOnly 'mezz.jei:jei-1.20.1-forge-api:15.20.0.115'
    compileOnly 'mezz.jei:jei-1.20.1-common-api:15.20.0.115'
    compileOnly 'maven.modrinth:jade:11.13.2+forge'

    runtimeOnly fg.deobf('dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5')
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    runtimeOnly fg.deobf('com.tterrag.registrate:Registrate:MC1.20-1.3.3')


    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

mixin {
    add sourceSets.main, 'dimensionworks_cave_factory.refmap.json'
    config 'dimensionworks_cave_factory.mixins.json'
    debug.verbose = true
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    dependsOn gradle.includedBuild('dimensionworks-rpm-limit').task(':reobfJar')
}

tasks.named('test') {
    dependsOn gradle.includedBuild('dimensionworks-rpm-limit').task(':reobfJar')
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    manifest.attributes([
        'MixinConfigs': 'dimensionworks_cave_factory.mixins.json'
    ])
    finalizedBy 'reobfJar'
}

// Opt-in client verification with the pack's fluid registration script and required runtime mods.
if (project.hasProperty('crystalCheck')) {
    dependencies {
        runtimeOnly fg.deobf(files("../dimensionworks-rpm-limit/build/libs/dimensionworks_rpm_limit-${rpmLimitVersion}-dev.jar"))
        runtimeOnly fg.deobf('mekanism:Mekanism:1.20.1-10.4.16.80')
        runtimeOnly fg.deobf('appeng:appliedenergistics2-forge:15.4.10')
        runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
        runtimeOnly fg.deobf('maven.modrinth:U6GY0xp0:lC8HHXOF')
        runtimeOnly fg.deobf('maven.modrinth:vLhkn5ux:j1560XGp')
        runtimeOnly fg.deobf('maven.modrinth:jJfV67b1:lTAAe4sZ')
        runtimeOnly fg.deobf('maven.modrinth:umyGl7zF:hVR2xUSr')
        runtimeOnly fg.deobf('maven.modrinth:lhGA9TYQ:1MKTLiiG')
        runtimeOnly fg.deobf('maven.modrinth:sk9knFPE:uNALdylI')
        runtimeOnly fg.deobf('maven.modrinth:guideme:20.1.15')
    }
    sourceSets {
        crystalCheck {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs.client {
        workingDirectory project.file('run-crystal-check')
        property 'dimensionworks.verifyCrystallizedFluids', 'true'
        mods.dimensionworks_cave_factory { sources = [sourceSets.main, sourceSets.crystalCheck] }
    }
}
if (project.hasProperty('crystalCheck')) {
    minecraft.runs {
        gameTestServer {
            workingDirectory project.file('run-crystal-check')
            property 'forge.enabledGameTestNamespaces', 'dimensionworks_cave_factory'
            mods.dimensionworks_cave_factory { sources = [sourceSets.main, sourceSets.crystalCheck] }
        }
    }
}

// Explicit, disposable server verification using the pack's pinned local runtime jars.
if (project.hasProperty('twilightCheck')) {
    if (!project.hasProperty('twilightMods')) {
        throw new GradleException('Supply -PtwilightMods=<DimensionWorks mods directory> for twilightCheck')
    }
    repositories { flatDir { dirs project.property('twilightMods') } }
    dependencies {
        runtimeOnly files("../dimensionworks-rpm-limit/build/libs/dimensionworks_rpm_limit-${rpmLimitVersion}-dev.jar")
        [
            'twilightforest:1.20.1-4.3.2508-universal', 'alexscaves:2.0.2',
            "Dimensions-of-Alex's-Caves:1.20.1-1.0.4", 'citadel:2.6.3-1.20.1',
            'Mekanism:1.20.1-10.4.16.80', 'appliedenergistics2-forge:15.4.10',
            'guideme:20.1.15',
            'curios-forge:5.14.1+1.20.1', 'kubejs-forge:2001.6.5-build.26',
            'rhino-forge:2001.2.3-build.10', 'architectury:9.2.14-forge'
        ].each { coordinate -> runtimeOnly fg.deobf("dw-test:${coordinate}") }
    }
    sourceSets {
        twilightCheck {
            compileClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs.gameTestServer {
        workingDirectory project.file('run-twilight-check')
        property 'forge.enabledGameTestNamespaces', 'dimensionworks_cave_factory'
        mods.dimensionworks_cave_factory { sources = [sourceSets.main, sourceSets.twilightCheck] }
    }
    tasks.register('prepareTwilightCheck', Copy) {
        dependsOn gradle.includedBuild('dimensionworks-rpm-limit').task(':devJar')
        from('../../kubejs') {
            include 'startup_scripts/twilight_industry.js'
            include 'data/dimensionworks_cave_factory/recipes/twilight/**'
            include 'data/dimensionworks_cave_factory/tags/items/twilight_leaves.json'
            include 'data/dimensionworks_cave_factory/tags/items/boar_feed.json'
            include 'data/dimensionworks_cave_factory/tags/blocks/root_bed.json'
        }
        into 'run-twilight-check/kubejs'
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn 'prepareTwilightCheck' }
}
