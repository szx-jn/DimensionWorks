pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

rootProject.name = 'dimensionworks-cave-factory'
includeBuild('../dimensionworks-rpm-limit') {
    dependencySubstitution {
        substitute(module('dev.szx.dimensionworks:dimensionworks_rpm_limit')).using(project(':'))
        substitute(module('dev.szx.dimensionworks:dimensionworks-rpm-limit')).using(project(':'))
    }
}
