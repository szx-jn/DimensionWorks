plugins { id 'java-library' }

version = '0.1.2'
base.archivesName = 'dimensionworks_jei_ticks'
apply from: rootProject.file('gradle/neoforge-module.gradle')
apply from: rootProject.file('gradle/neoforge-create.gradle')
dependencies {
    implementation 'maven.modrinth:jei:kmb7KviL'
    runtimeOnly 'maven.modrinth:mezzconfig:sPQlt1iR'
    compileOnly 'maven.modrinth:jade:eYz2YBGT'
    compileOnly 'maven.modrinth:mekanism:5KzzycBT'
    compileOnly 'maven.modrinth:create-enchantment-industry:qUpvzZ83'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
test { useJUnitPlatform() }
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

if (project.hasProperty('jeiClientCheck')) {
    sourceSets.create('clientCheck') {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    sourceSets.clientCheck.resources.srcDir layout.buildDirectory.dir('client-check-resources')
    tasks.register('prepareJeiClientData', Copy) {
        from(rootProject.file('kubejs/data/createdieselgenerators')) { into 'data/createdieselgenerators' }
        from(rootProject.file('kubejs/data/create_enchantment_industry/loot_table')) { into 'data/create_enchantment_industry/loot_table' }
        into layout.buildDirectory.dir('client-check-resources')
    }
    tasks.named('processClientCheckResources') { dependsOn 'prepareJeiClientData' }
    dependencies {
        clientCheckImplementation 'maven.modrinth:jade:eYz2YBGT'
        clientCheckImplementation 'maven.modrinth:mekanism:5KzzycBT'
        clientCheckRuntimeOnly 'maven.modrinth:guideme:QeYKsstN'
        clientCheckRuntimeOnly 'maven.modrinth:create-diesel-generators:UoPH8lO1'
        clientCheckRuntimeOnly 'maven.modrinth:create-enchantment-industry:qUpvzZ83'
        clientCheckRuntimeOnly 'maven.modrinth:create-dragons-plus:b0u9vk8C'
        clientCheckRuntimeOnly 'maven.modrinth:create-liquid-fuel:rLn2bDVE'
        clientCheckRuntimeOnly 'maven.modrinth:draconic-evolution:84xwXpNh'
        clientCheckRuntimeOnly 'maven.modrinth:brandons-core:56nwe5IX'
        clientCheckRuntimeOnly 'maven.modrinth:codechicken-lib:vLDGhjNJ'
        clientCheckRuntimeOnly 'maven.modrinth:curios:KJsZIQrT'
    }
    neoForge {
        mods { dimensionworks_jei_ticks { sourceSet sourceSets.clientCheck } }
        runs.client {
            sourceSet = sourceSets.clientCheck
            gameDirectory = project.file('run-client-jei')
            systemProperty 'dimensionworks.jeiClientCheck', 'true'
            jvmArguments.addAll('-Xmx2G', '-XX:ActiveProcessorCount=2')
            programArguments.addAll('--width', '1024', '--height', '600')
        }
    }
    tasks.named('runClient') {
        doFirst { file('run-client-jei/logs/latest.log').delete() }
        doLast {
            def log = file('run-client-jei/logs/latest.log')
            if (!log.exists() || !log.getText('UTF-8').contains('JEI NATIVE CLIENT CHECK PASSED:')) {
                throw new GradleException('Actual native JEI client check did not complete')
            }
        }
    }
}
