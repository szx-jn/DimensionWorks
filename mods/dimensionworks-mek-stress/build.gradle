plugins { id 'java-library' }

version = '0.3.30'
base.archivesName = 'dimensionworks_mek_stress'
apply from: rootProject.file('gradle/neoforge-module.gradle')
apply from: rootProject.file('gradle/neoforge-create.gradle')

dependencies {
    implementation project(':dimensionworks-rpm-limit')
    implementation 'maven.modrinth:mekanism:5KzzycBT'
    implementation 'maven.modrinth:mekanism-generators:a6gl7srE'
    implementation 'maven.modrinth:ae2:7Ac6mXbf'
    implementation 'maven.modrinth:applied-create:rqrW3P8C'
    implementation 'maven.modrinth:kotlin-for-forge:9ZlVvei8'
    implementation 'maven.modrinth:draconic-evolution:84xwXpNh'
    implementation 'maven.modrinth:brandons-core:56nwe5IX'
    implementation 'maven.modrinth:codechicken-lib:vLDGhjNJ'
    implementation 'maven.modrinth:jade:eYz2YBGT'
    runtimeOnly 'maven.modrinth:curios:KJsZIQrT'
    runtimeOnly 'maven.modrinth:guideme:QeYKsstN'
    implementation 'maven.modrinth:create-more-package-couriers:aG9jHA8l'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
test { useJUnitPlatform() }
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
}

ext.gameTestCount = 17
apply from: rootProject.file('gradle/neoforge-gametest.gradle')
