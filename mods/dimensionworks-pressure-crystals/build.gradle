plugins { id 'java-library' }

version = '0.1.2'
base.archivesName = 'dimensionworks_pressure_crystals'
apply from: rootProject.file('gradle/neoforge-module.gradle')
apply from: rootProject.file('gradle/neoforge-create.gradle')

repositories { maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } } }
dependencies {
    runtimeOnly project(':dimensionworks-cave-factory')
    compileOnly 'maven.modrinth:jade:eYz2YBGT'
    implementation 'curse.maven:vintage-improvenents-ssw-edition-1255448:8941692'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
test { useJUnitPlatform() }
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

ext.gameTestCount = 19
apply from: rootProject.file('gradle/neoforge-gametest.gradle')
sourceSets.gameTest {
    java.srcDir 'src/pressureCheck/java'
    resources.srcDir 'src/pressureCheck/resources'
}
dependencies {
    gameTestRuntimeOnly 'maven.modrinth:create-diesel-generators:UoPH8lO1'
    gameTestRuntimeOnly 'maven.modrinth:kubejs-create:1qmcLagN'
    gameTestRuntimeOnly 'maven.modrinth:kubejs:GDXCpKlp'
    gameTestRuntimeOnly 'maven.modrinth:rhino:SqkDvOLG'
    gameTestRuntimeOnly 'maven.modrinth:better-advanced-tooltips:uPFbnD32'
}
neoForge.runs.gameTestServer { jvmArgument '-XX:ActiveProcessorCount=2' }
tasks.register('preparePressureCheck', Copy) {
    from(rootProject.file('kubejs/startup_scripts/molten_metals.js')) { into 'startup_scripts' }
    from(rootProject.file('kubejs/data/vintageimprovements/recipe/craft/fiery_wire.json')) { into 'data/vintageimprovements/recipe/craft' }
    from(rootProject.file('kubejs/data/createdieselgenerators/loot_table/blocks/andesite_girder_strut.json')) { into 'data/createdieselgenerators/loot_table/blocks' }
    into 'run-gametest/kubejs'
}
tasks.named('runGameTestServer') { dependsOn 'preparePressureCheck' }
