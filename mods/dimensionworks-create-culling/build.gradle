plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
version = '0.1.0'
group = 'dev.szx.dimensionworks'
base.archivesName = 'dimensionworks_create_culling'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}
repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    flatDir { dirs 'probe-libs' }
    mavenCentral()
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    implementation fg.deobf('com.simibubi.create:create-1.20.1:6.0.8-291:slim')
    implementation fg.deobf('dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5')
    implementation fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
    implementation fg.deobf('com.tterrag.registrate:Registrate:MC1.20-1.3.3')
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    if (providers.gradleProperty('probeCompat').getOrElse('false') == 'true') {
        runtimeOnly fg.deobf('maven.modrinth:embeddium:UTbfe5d1')
        runtimeOnly fg.deobf('local:mekalus:1.8.0.1')
    }
}
mixin {
    add sourceSets.main, 'dimensionworks_create_culling.refmap.json'
    config 'dimensionworks_create_culling.mixins.json'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
jar {
    manifest.attributes(['MixinConfigs': 'dimensionworks_create_culling.mixins.json'])
    finalizedBy 'reobfJar'
}

// The probe has its own world and never enters the published jar.
sourceSets {
    probe {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft.runs {
    client {
        workingDirectory project.file('run-probe')
        property 'dimensionworks.culling.probe', 'true'
        property 'dimensionworks.culling.shaders', providers.gradleProperty('probeShaders').getOrElse('false')
        property 'dimensionworks.culling.backend', providers.gradleProperty('probeBackend').getOrElse('instancing')
        mods {
            dimensionworks_create_culling { sources = [sourceSets.main, sourceSets.probe] }
        }
    }
}
