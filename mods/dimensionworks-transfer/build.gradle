plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'eclipse'
    id 'idea'
}
version = '0.3.14'
group = 'dev.szx.dimensionworks'
base.archivesName = 'dimensionworks_transfer'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods {
                dimensionworks_transfer {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    // The pack already requires this fixed CMP fork release. Use its public API,
    // without embedding or copying third-party code into this module.
    ivy {
        url = 'https://github.com/szx-jn/Create-Mobile-Packages/releases/download'
        patternLayout { artifact '[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule 'dw-cmp', 'create_mobile_packages' }
    }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://maven.theillusivec4.top' }
    mavenCentral()
}

// Opt-in local runtime verification uses pinned installed release JARs, remapped for userdev.
// These verification dependencies are never embedded in the mod JAR or added to the pack.
if (project.hasProperty('transferTestModsDir')) {
    repositories {
        flatDir { dirs project.property('transferTestModsDir') }
        if (project.hasProperty('alexDispatchCheck')) {
            flatDir { dirs '../dimensionworks-cave-factory/build/libs', '../dimensionworks-rpm-limit/build/libs' }
        }
    }
    dependencies {
        runtimeOnly fg.deobf('dw-test:twilightforest:1.20.1-4.3.2508-universal')
        if (!project.hasProperty('alexDispatchClientCheck')) {
            runtimeOnly fg.deobf('dw-test:appliedenergistics2-forge:15.4.10')
            runtimeOnly fg.deobf('dw-test:guideme:20.1.15')
            runtimeOnly fg.deobf('dw-test:Mekanism:1.20.1-10.4.16.80')
            if (!project.hasProperty('alexDispatchCheck')) {
                runtimeOnly fg.deobf('dw-test:MekanismGenerators:1.20.1-10.4.16.80')
                runtimeOnly fg.deobf('dw-test:megacells-forge:2.4.6-1.20.1')
                runtimeOnly fg.deobf('dw-test:Applied-Mekanistics:1.4.3')
                runtimeOnly fg.deobf('dw-test:cloth-config:11.1.136-forge')
            }
        }
        if (project.hasProperty('elasticRecipeCheck') || project.hasProperty('alexDispatchCheck')) {
            runtimeOnly fg.deobf('dw-test:kubejs-forge:2001.6.5-build.26')
            runtimeOnly fg.deobf('dw-test:kubejs-create-forge:2001.3.0-build.8')
            runtimeOnly fg.deobf('dw-test:rhino-forge:2001.2.3-build.10')
            runtimeOnly fg.deobf('dw-test:architectury:9.2.14-forge')
            if (project.hasProperty('elasticRecipeCheck')) runtimeOnly fg.deobf('dw-test:vintageimprovements:1.20.1-0.3.7.9')
        }
        if (project.hasProperty('alexDispatchCheck')) {
            runtimeOnly fg.deobf('dw-test:alexscaves:2.0.2')
            runtimeOnly fg.deobf("dw-test:Dimensions-of-Alex's-Caves:1.20.1-1.0.4")
            runtimeOnly fg.deobf('dw-test:citadel:2.6.3-1.20.1')
            ['dimensionworks-cave-factory', 'dimensionworks-rpm-limit'].each { name ->
                def versionMatch = file("../${name}/build.gradle").getText('UTF-8') =~ /(?m)^version = '([^']+)'$/
                if (!versionMatch.find()) throw new GradleException("Cannot determine test dependency version: ${name}")
                runtimeOnly fg.deobf("dw-test:${name.replace('-', '_')}:${versionMatch.group(1)}")
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.16'
    implementation fg.deobf('dw-cmp:create_mobile_packages:1.20.1-0.6.1-dimensionworks.15')
    implementation fg.deobf('com.simibubi.create:create-1.20.1:6.0.8-291:slim')
    implementation fg.deobf('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
    implementation fg.deobf('dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5')
    implementation fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
    implementation fg.deobf('com.tterrag.registrate:Registrate:MC1.20-1.3.3')
    runtimeOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Opt-in Forge runtime checks, excluded from the production and release JAR.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft.runs {
    gameTestServer {
        workingDirectory project.file(project.hasProperty('alexDispatchCheck') ? 'run-alex-dispatch-check' : 'run-gametest-recovery')
        property 'forge.enabledGameTestNamespaces', project.findProperty('transferGameTestNamespaces') ?: 'dimensionworks_transfer'
        mods.dimensionworks_transfer.sources = [sourceSets.main, sourceSets.gameTest]
    }
}

// Local visual/physics smoke check only; never included in the production JAR or CI.
if (project.hasProperty('elasticClientCheck')) {
    sourceSets {
        elasticClientTest {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs.client {
        workingDirectory project.file('run-elastic-client')
        args '--quickPlaySingleplayer', 'ElasticCheck', '--width', '1100', '--height', '750'
        mods.dimensionworks_transfer.sources = [sourceSets.main, sourceSets.elasticClientTest]
        if (project.hasProperty('elasticVerticalBeltClientCheck'))
            property 'dimensionworks.elasticVerticalBeltClientCheck', 'true'
    }
}

if (project.hasProperty('alexDispatchClientCheck')) {
    sourceSets {
        dispatchClientCheck {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs.client {
        workingDirectory project.file('run-alex-dispatch-client')
        args '--width', '1100', '--height', '750'
        mods.dimensionworks_transfer.sources = [sourceSets.main, sourceSets.dispatchClientCheck]
    }
}

mixin { add sourceSets.main, 'dimensionworks_transfer.refmap.json'; config 'dimensionworks_transfer.mixins.json' }


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest.attributes(['MixinConfigs': 'dimensionworks_transfer.mixins.json'])
    finalizedBy 'reobfJar'
}
