plugins { id 'java-library' }

version = '0.3.14'
base.archivesName = 'dimensionworks_transfer'
apply from: rootProject.file('gradle/neoforge-module.gradle')
apply from: rootProject.file('gradle/neoforge-create.gradle')

repositories { maven { url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } } }
dependencies {
    implementation 'maven.modrinth:curios:KJsZIQrT'
    implementation 'curse.maven:the-twilight-forest-227639:7797302'
    implementation 'maven.modrinth:mekanism:5KzzycBT'
    implementation 'maven.modrinth:ae2:7Ac6mXbf'
    runtimeOnly 'maven.modrinth:guideme:QeYKsstN'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
apply from: rootProject.file('gradle/neoforge-cmp.gradle')

test { useJUnitPlatform() }
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
ext.gameTestCount = project.hasProperty('alexDispatchCheck') ? 52 : project.hasProperty('elasticRecipeCheck') ? 43 : 40
apply from: rootProject.file('gradle/neoforge-gametest.gradle')

neoForge.runs.gameTestServer {
    systemProperty 'neoforge.enabledGameTestNamespaces', 'dimensionworks_transfer,dimensionworks_elastic,dimensionworks_cardboard'
    jvmArgument '-XX:ActiveProcessorCount=2'
}

if (project.hasProperty('transferSnapshot')) {
    test { systemProperty 'dimensionworks.transferSnapshot', file(project.property('transferSnapshot')).absolutePath }
}

if (project.hasProperty('transferClientCheck')) {
    def mode = project.property('transferClientCheck').toString()
    def checks = [elastic: ['dimensionworks.elasticClientCheck', 'ELASTIC_CLIENT_CHECK_PASS:'],
                  vertical: ['dimensionworks.elasticVerticalBeltClientCheck', 'ELASTIC_VERTICAL_BELT_CLIENT_CHECK_PASS:'],
                  dispatch: ['dimensionworks.dispatchClientCheck', 'ALEX_DISPATCH_GUI_PASS:'],
                  transfer: ['dimensionworks.transferTravelClientCheck', 'TRANSFER TRAVEL CLIENT CHECK PASSED:']]
    if (!checks.containsKey(mode)) throw new GradleException('transferClientCheck must be elastic, vertical, dispatch or transfer')
    sourceSets.create('clientCheck') {
        java.srcDirs = ['src/clientCheck/java', 'src/elasticClientTest/java', 'src/dispatchClientCheck/java']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    neoForge {
        mods { dimensionworks_transfer { sourceSet sourceSets.clientCheck } }
        runs.client {
            sourceSet = sourceSets.clientCheck
            gameDirectory = project.file('run-client-' + mode)
            systemProperty checks[mode][0], 'true'
            jvmArguments.addAll('-Xmx2G', '-XX:ActiveProcessorCount=2')
            programArguments.addAll('--width', '1024', '--height', '600')
        }
    }
    tasks.named('runClient') {
        def resultLog = project.file('run-client-' + mode + '/logs/latest.log')
        doFirst { resultLog.delete() }
        doLast {
            if (!resultLog.exists() || !resultLog.getText('UTF-8').contains(checks[mode][1])) {
                throw new GradleException('Transfer client check incomplete: ' + mode)
            }
        }
    }
}

if (project.hasProperty('elasticRecipeCheck') || project.hasProperty('alexDispatchCheck')) {
    dependencies {
        runtimeOnly 'maven.modrinth:kubejs:GDXCpKlp'
        runtimeOnly 'maven.modrinth:rhino:SqkDvOLG'
        runtimeOnly 'maven.modrinth:kubejs-create:1qmcLagN'
        runtimeOnly 'maven.modrinth:better-advanced-tooltips:uPFbnD32'
        runtimeOnly 'curse.maven:vintage-improvenents-ssw-edition-1255448:8941692'
    }
    neoForge.runs.gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'dimensionworks_transfer,dimensionworks_elastic,dimensionworks_cardboard,dimensionworks_elastic_recipe'
    }
    tasks.register('prepareElasticRecipeCheck', Copy) {
        from(rootProject.file('kubejs/startup_scripts/elastic_packager.js')) { into 'startup_scripts' }
        from(rootProject.file('kubejs/server_scripts/elastic_packager.js')) { into 'server_scripts' }
        from(rootProject.file('kubejs/data/dimensionworks_transfer')) { into 'data/dimensionworks_transfer' }
        from(rootProject.file('kubejs/data/vintageimprovements/recipe/craft/fiery_wire.json')) { into 'data/vintageimprovements/recipe/craft' }
        into 'run-gametest/kubejs'
    }
    tasks.named('runGameTestServer') { dependsOn 'prepareElasticRecipeCheck' }
}

if (project.hasProperty('alexDispatchCheck')) {
    dependencies { runtimeOnly project(':dimensionworks-cave-factory') }
    neoForge.runs.gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'dimensionworks_transfer,dimensionworks_elastic,dimensionworks_cardboard,dimensionworks_elastic_recipe,dimensionworks_alex_dispatch'
    }
}
