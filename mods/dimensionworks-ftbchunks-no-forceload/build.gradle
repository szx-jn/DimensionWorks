plugins { id 'java-library' }

version = '0.1.3'
base.archivesName = 'dimensionworks_ftbchunks_no_forceload'
apply from: rootProject.file('gradle/neoforge-module.gradle')

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
        metadataSources { artifact() }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation 'curse.maven:ftb-chunks-314906:9594476'
    implementation 'curse.maven:ftb-library-404465:9650381'
    runtimeOnly 'curse.maven:ftb-teams-404468:9434081'
    runtimeOnly 'maven.modrinth:architectury-api:13.0.12+neoforge'
}

ext.gameTestCount = 1
apply from: rootProject.file('gradle/neoforge-gametest.gradle')

dependencies {
    gameTestImplementation 'curse.maven:ftb-teams-404468:9434081'
}
