plugins { id 'java-library' }

version = '0.1.2'
base.archivesName = 'dimensionworks_drop_lifetime'
apply from: rootProject.file('gradle/neoforge-module.gradle')

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
        metadataSources { artifact() }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation 'curse.maven:ftb-chunks-314906:9594476'
    implementation 'curse.maven:ftb-library-404465:9650381'
    runtimeOnly 'curse.maven:ftb-teams-404468:9434081'
    runtimeOnly 'maven.modrinth:architectury-api:13.0.12+neoforge'
}

ext.gameTestCount = 1
apply from: rootProject.file('gradle/neoforge-gametest.gradle')

// 一次性迁移工具复用已锁定的 Minecraft/FTB 运行依赖，不另搭构建或下载链。
def migrationClasspath = sourceSets.main.runtimeClasspath
def migrationClasspathFile = rootProject.layout.buildDirectory.file('migration/classpath.txt')
tasks.register('writeMigrationClasspath') {
    dependsOn tasks.named('classes')
    inputs.files(migrationClasspath)
    outputs.file(migrationClasspathFile)
    doLast {
        def target = migrationClasspathFile.get().asFile
        target.parentFile.mkdirs()
        target.text = migrationClasspath.files.collect { it.absolutePath }.join('\n') + '\n'
    }
}
