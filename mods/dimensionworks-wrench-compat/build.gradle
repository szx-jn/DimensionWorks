plugins { id 'java-library' }

version = '0.1.0'
base.archivesName = 'dimensionworks_wrench_compat'
apply from: rootProject.file('gradle/neoforge-module.gradle')
apply from: rootProject.file('gradle/neoforge-create.gradle')

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
        metadataSources { artifact() }
    }
}
dependencies {
    implementation 'curse.maven:ftb-ultimine-386134:8231400'
    implementation 'maven.modrinth:architectury-api:13.0.12+neoforge'
    runtimeOnly 'curse.maven:ftb-library-404465:9650381'
}

sourceSets {
    gameTest
}
configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
dependencies {
    gameTestRuntimeOnly 'maven.modrinth:mekanism:5KzzycBT'
    gameTestRuntimeOnly 'maven.modrinth:ae2:7Ac6mXbf'
    gameTestRuntimeOnly 'maven.modrinth:guideme:QeYKsstN'
}
ext.gameTestCount = 2
apply from: rootProject.file('gradle/neoforge-gametest.gradle')
