// Build the exact reviewed CMP source commit; Git verifies every fetched object against its commit hash.
def commit = 'bb0b5c18f811fee357c81dee86306952686b49de'
def sourceDirectory = layout.buildDirectory.dir("cmp-source/${commit}")
def jarName = 'create_mobile_packages-1.21.1-0.7.8-dimensionworks.4.jar'

if (project.hasProperty('cmpTestJar')) {
    def developmentJar = file(project.property('cmpTestJar'))
    if (!developmentJar.isFile()) throw new GradleException("缺少 CMP 开发验证 JAR: ${developmentJar}")
    dependencies { implementation files(developmentJar) }
} else {
    def prepareSource = tasks.register('prepareCMPSource') {
        inputs.property('commit', commit)
        outputs.file(sourceDirectory.map { it.file('gradle.properties') })
        doLast {
            def directory = sourceDirectory.get().asFile
            delete directory
            directory.mkdirs()
            exec { commandLine 'git', 'init', directory.absolutePath }
            exec {
                workingDir directory
                commandLine 'git', 'remote', 'add', 'origin', 'https://github.com/szx-jn/Create-Mobile-Packages.git'
            }
            exec {
                workingDir directory
                commandLine 'git', 'fetch', '--depth=1', 'origin', commit
            }
            exec {
                workingDir directory
                commandLine 'git', 'checkout', '--detach', 'FETCH_HEAD'
            }
            def actualCommit = new ByteArrayOutputStream()
            exec {
                workingDir directory
                standardOutput = actualCommit
                commandLine 'git', 'rev-parse', 'HEAD'
            }
            if (actualCommit.toString('UTF-8').trim() != commit) {
                throw new GradleException('CMP 源码提交校验失败；拒绝构建')
            }
        }
    }
    def sourceJar = sourceDirectory.map { it.file("build/libs/${jarName}") }
    def buildSource = tasks.register('buildCMPSource', Exec) {
        dependsOn prepareSource
        inputs.property('commit', commit)
        outputs.file(sourceJar)
        workingDir sourceDirectory
        commandLine 'bash', 'gradlew', '--no-daemon', '--max-workers=2', '--console=plain', 'jar'
        environment 'BRANCH_NAME', ''
        environment 'BUILD_NUMBER', ''
    }
    dependencies { implementation files(sourceJar).builtBy(buildSource) }
}
